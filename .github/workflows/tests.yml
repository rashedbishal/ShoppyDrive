name: Run Tests

on: [push, pull_request]

# INFRA-004: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, gd, zip, bcmath, opcache
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Same as deploy.yml's checks job: feature tests that render a real
      # Inertia page need public/build/manifest.json, or they all fail with
      # ViteManifestNotFoundException. The build needs the gitignored
      # resources/js/ziggy.js, so generate that first.
      - name: Generate Ziggy routes file
        run: php artisan ziggy:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Pint (PHP style) runs as part of `composer test`'s `@lint:check`
      # step, so this one command covers both PHP style and the full Pest
      # suite — the test DB is SQLite in-memory per phpunit.xml, so no
      # external database service is needed here.
      - name: Run Pint and the full Pest suite
        run: composer test

  # INFRA-003: the suite above runs on SQLite, so without this the first
  # MariaDB run of every migration was production's `migrate --force`, where
  # a failed DDL statement doesn't roll back. Runs every migration on a fresh
  # MariaDB matching production's major/minor version (11.8). Visibility only:
  # deploy.yml does not wait for this workflow.
  mariadb-migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: shoppydrive_test_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: shoppydrive_test_ci
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Confirm the target is the disposable CI database
        run: |
          php -r 'exit(str_starts_with(getenv("DB_DATABASE"), "shoppydrive_test_") ? 0 : 1);'
          php artisan db:show

      # The same command deploy.yml runs on production.
      - name: Run every migration on MariaDB
        run: php artisan migrate --force

      - name: Show the migration status
        run: php artisan migrate:status

      - name: A second run must have nothing left to migrate
        run: php artisan migrate --force | tee migrate-again.log && grep -q 'Nothing to migrate' migrate-again.log
