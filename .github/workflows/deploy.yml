name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  # OPS-001: deployment used to proceed unconditionally on every push to
  # main, with no gate of any kind — tests.yml/lint.yml existed but were
  # both disabled (`if: false`) and, even enabled, are separate workflow
  # files that GitHub Actions has no mechanism to make this workflow
  # `needs:` across files. This job runs the one check that's currently
  # clean across the whole codebase (Pint + the full Pest suite, via the
  # same `composer test` script CLAUDE.md already documents as the local
  # quality gate) directly inside this workflow, and `deploy` below
  # requires it to pass. The JS-side checks (ESLint/Prettier/tsc) are
  # deliberately NOT included here yet: as of this commit they fail on
  # hundreds of pre-existing, unrelated issues (see lint.yml, which runs
  # them independently for visibility) — hard-gating deployment on them
  # right now would block every future deploy until that separate cleanup
  # happens. Add `- name: ...` / `run: npm ...` steps here (mirroring
  # lint.yml) and they'll automatically gate `deploy` once that's done.
  checks:
    name: Required checks (Pint + Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, gd, zip, bcmath, opcache
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # resources/js/app.tsx statically imports './ziggy' (gitignored, a
      # build output like Wayfinder's resources/js/actions) — on a bare
      # checkout the file doesn't exist, so npm run build fails outright,
      # and several feature tests that render a real Inertia page (not
      # just assert on JSON) need public/build/manifest.json to exist at
      # all, independent of its content, or every one of them 500s with
      # Illuminate\Foundation\ViteManifestNotFoundException. The real
      # production URL doesn't matter here since this build is only
      # exercised by the test suite, never served.
      - name: Generate Ziggy routes file
        run: php artisan ziggy:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Pint and the full Pest suite
        run: composer test

  deploy:
    name: Build & Deploy
    needs: checks
    runs-on: ubuntu-latest
    # DEPLOY-SAFETY-001 (Tier 1): requires the "production" GitHub Environment
    # to exist with required reviewers configured (repo Settings > Environments)
    # — every run pauses here for manual approval before touching the server.
    environment: production
    # Queues a second concurrent push instead of racing two deploys against
    # the same server/database; never cancels a deploy already in progress.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. PHP setup ─────────────────────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip, bcmath, opcache
          coverage: none

      # ── 3. Node.js setup ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 4. PHP dependencies ──────────────────────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      # resources/js/ziggy.js is gitignored (build output, like Wayfinder's
      # resources/js/actions) — it must be regenerated here with the real
      # production URL, otherwise the frontend build has no route config at
      # all, or (if a stale local copy ever gets committed again) ships
      # whatever localhost url was baked in on someone's machine.
      - name: Generate Ziggy routes file
        run: php artisan ziggy:generate --url=https://shoppydrive.com

      # ── 5. JS dependencies & build ───────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ── 6. Deploy via SSH / rsync to Hostinger ───────────────────────────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # DEPLOY-SAFETY-001 (Tier 1): pins the server's host key instead of
      # trusting whatever key is presented on connection (StrictHostKeyChecking=no),
      # which would accept an impostor host silently. SSH_KNOWN_HOSTS must hold
      # the exact `known_hosts`-format line(s) for this host, captured out of
      # band (e.g. `ssh-keyscan -p <port> <host>`, verified against hPanel).
      - name: Add pinned SSH known host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync files to server
        env:
          RSYNC_RSH: ssh -o StrictHostKeyChecking=yes -p ${{ secrets.SSH_PORT }}
        run: |
          rsync -azP \
            --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*.php' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # ── 7. Post-deploy artisan commands ──────────────────────────────────────
      - name: Run post-deploy tasks on server
        run: |
          ssh -o StrictHostKeyChecking=yes \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e
            cd '${{ secrets.DEPLOY_PATH }}'

            if [ ! -f .env ]; then
              echo '❌ ERROR: .env file is missing.'
              exit 1
            fi

            # DEPLOY-SAFETY-001 (Tier 1): existence alone doesn't catch a
            # stale/incomplete .env — check each required key has a non-empty
            # value without ever printing it (grep -q only reports match/no
            # match, never the matched line).
            for key in APP_KEY DB_CONNECTION DB_DATABASE DB_USERNAME DB_PASSWORD; do
              if ! grep -Eq \"^\$key=.+\" .env; then
                echo \"❌ ERROR: \$key is missing or empty in .env.\"
                exit 1
              fi
            done

            mkdir -p bootstrap/cache storage/framework/{sessions,views,cache/data} storage/logs
            # DEPLOY-SAFETY-001 (Tier 1): no longer swallowed with `|| true` —
            # set -e above now stops the deploy if this genuinely fails,
            # rather than silently continuing with wrong permissions.
            chmod -R 775 bootstrap/cache storage
            rm -rf public/storage
            ln -snf ../storage/app/public public/storage

            # bootstrap/cache/*.php is excluded from the rsync above (so a
            # mid-sync tree is never served from a half-updated cache), which
            # means a stale cache here survives every deploy indefinitely —
            # discovered when packages.php/services.php (regenerated only by
            # composer, which never runs on this server) sat 5+ months stale
            # and left spatie/laravel-activitylog unregistered, which crashed
            # every single artisan command (including config:clear itself,
            # since booting to run it already triggers the same crash) with
            # 'Trying to access array offset on null' in CauserResolver.php.
            # Deleting the cache files directly, before any artisan command
            # runs, sidesteps that chicken-and-egg failure entirely.
            rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/events.php bootstrap/cache/packages.php bootstrap/cache/services.php
            php artisan package:discover --ansi

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear
            php artisan migrate --force
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache"

      # ── 8. Post-deploy health check ──────────────────────────────────────────
      # DEPLOY-SAFETY-001 (Tier 1): confirms the app actually boots after the
      # deploy, rather than only trusting that the SSH script exited 0. Note:
      # Laravel's /up has no DiagnosingHealth listener registered in this app,
      # so this proves the PHP/Laravel boot succeeds, not that the database is
      # reachable or correct — a known, accepted limitation of Tier 1.
      - name: Verify deployment health
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 https://shoppydrive.com/up > /dev/null; then
              echo "✅ Health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 10 attempts — deployment is live but the application is not responding healthily."
          exit 1