name: Deploy to Hostinger

on:
  push:
    branches:
      - main

# INFRA-004: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # OPS-001: deployment used to proceed unconditionally on every push to
  # main, with no gate of any kind — tests.yml/lint.yml existed but were
  # both disabled (`if: false`) and, even enabled, are separate workflow
  # files that GitHub Actions has no mechanism to make this workflow
  # `needs:` across files. This job runs the one check that's currently
  # clean across the whole codebase (Pint + the full Pest suite, via the
  # same `composer test` script CLAUDE.md already documents as the local
  # quality gate) directly inside this workflow, and `deploy` below
  # requires it to pass. The JS-side checks (ESLint/Prettier/tsc) are
  # deliberately NOT included here yet: as of this commit they fail on
  # hundreds of pre-existing, unrelated issues (see lint.yml, which runs
  # them independently for visibility) — hard-gating deployment on them
  # right now would block every future deploy until that separate cleanup
  # happens. Add `- name: ...` / `run: npm ...` steps here (mirroring
  # lint.yml) and they'll automatically gate `deploy` once that's done.
  checks:
    name: Required checks (Pint + Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, gd, zip, bcmath, opcache
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # resources/js/app.tsx statically imports './ziggy' (gitignored, a
      # build output like Wayfinder's resources/js/actions) — on a bare
      # checkout the file doesn't exist, so npm run build fails outright,
      # and several feature tests that render a real Inertia page (not
      # just assert on JSON) need public/build/manifest.json to exist at
      # all, independent of its content, or every one of them 500s with
      # Illuminate\Foundation\ViteManifestNotFoundException. The real
      # production URL doesn't matter here since this build is only
      # exercised by the test suite, never served.
      - name: Generate Ziggy routes file
        run: php artisan ziggy:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Pint and the full Pest suite
        run: composer test

  deploy:
    name: Build & Deploy
    needs: checks
    runs-on: ubuntu-latest
    # DEPLOY-SAFETY-001 (Tier 1): requires the "production" GitHub Environment
    # to exist with required reviewers configured (repo Settings > Environments)
    # — every run pauses here for manual approval before touching the server.
    environment: production
    # Queues a second concurrent push instead of racing two deploys against
    # the same server/database; never cancels a deploy already in progress.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    # MED-15: confirms what Laravel itself reports on the server, where the
    # manually managed .env lives. This workflow can't see that file and must
    # never upload or print it, and the about command returns no secrets. Run
    # over SSH by the two steps below; argument 2 chooses what is read:
    #  - env-file: reads .env directly. APP_CONFIG_CACHE points at a file that
    #    doesn't exist, so the live config cache is neither read nor changed.
    #    A plain check would read that cache, then config:cache would adopt
    #    whatever .env says.
    #  - active-config: reads the config cache the site is actually running.
    # Laravel defaults to production with debug off, so a missing .env or
    # cache must fail here rather than appear to pass. Any failure to start
    # Laravel or parse its output fails closed too.
    env:
      VERIFY_RUNTIME_SCRIPT: |
        set -euo pipefail
        cd "$1"

        if [ "$2" = env-file ]; then
          if [ ! -f .env ]; then
            echo 'ERROR: .env file is missing.'
            exit 1
          fi

          export APP_CONFIG_CACHE=storage/framework/deploy-check-no-config-cache.php
        elif [ ! -f bootstrap/cache/config.php ]; then
          echo 'ERROR: the config cache is missing.'
          exit 1
        fi

        if ! php artisan about --only=environment --json 2>/dev/null \
          | php -r '$a = json_decode(stream_get_contents(STDIN), true)["environment"] ?? []; exit(($a["environment"] ?? null) === "production" && ($a["debug_mode"] ?? null) === false ? 0 : 1);'; then
          echo 'ERROR: Laravel did not report APP_ENV=production with APP_DEBUG=false.'
          exit 1
        fi

        echo 'Laravel reports APP_ENV=production with APP_DEBUG=false.'

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ── 2. PHP setup ─────────────────────────────────────────────────────────
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip, bcmath, opcache
          coverage: none

      # ── 3. Node.js setup ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 4. PHP dependencies ──────────────────────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      # resources/js/ziggy.js is gitignored (build output, like Wayfinder's
      # resources/js/actions) — it must be regenerated here with the real
      # production URL, otherwise the frontend build has no route config at
      # all, or (if a stale local copy ever gets committed again) ships
      # whatever localhost url was baked in on someone's machine.
      - name: Generate Ziggy routes file
        run: php artisan ziggy:generate --url=https://shoppydrive.com

      # ── 5. JS dependencies & build ───────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ── 6. Deploy via SSH / rsync to Hostinger ───────────────────────────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # MED-15: files are live as rsync writes them, with no later activation
      # step, so this is the only point a deploy can still be stopped. shell:
      # bash turns on pipefail for this pipe, and ssh returns the script's exit
      # code. The same applies to the verification after the deploy.
      - name: Verify production runtime before deploying
        shell: bash
        run: |
          printf '%s' "$VERIFY_RUNTIME_SCRIPT" | ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -s -- '${{ secrets.DEPLOY_PATH }}' env-file"

      # INFRA-001: rsync writes files in place and migrations run afterwards,
      # so without this, customers hit half-copied code or code ahead of its
      # schema for a minute or two. The page is pre-rendered, so it is served
      # without booting the half-copied app; the browser retries every 15s.
      # Webhooks and the SMS forwarder stay open (bootstrap/app.php). If the
      # optional MAINTENANCE_BYPASS_SECRET secret is set, visiting
      # https://shoppydrive.com/<secret> lets the owner see the site anyway.
      # Switched off at the end of the post-deploy script, or by the
      # failure step below if any later step fails.
      - name: Enable maintenance mode
        id: maintenance
        env:
          BYPASS_SECRET: ${{ secrets.MAINTENANCE_BYPASS_SECRET }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd '${{ secrets.DEPLOY_PATH }}' && php artisan down --render='errors::503' --retry=60 --refresh=15 ${BYPASS_SECRET:+--secret=$BYPASS_SECRET}"

      # DEPLOY-SAFETY-001 (Tier 1): SSH host-key pinning was added then
      # explicitly reverted the same day by user decision after it correctly
      # failed closed (no verified SSH_KNOWN_HOSTS secret was configured),
      # blocking a deploy. StrictHostKeyChecking=no accepts whatever key the
      # server presents with no verification — a known, accepted risk (M1 in
      # the DEPLOY-SAFETY-001 audit) — rather than require the known_hosts
      # setup before every future deploy can proceed.
      #
      # SEC-022: internal docs (audit reports, tracker, handoff with the SSH
      # host), tests and AI-agent config are never deployed. The root-anchored
      # list must match CourierVerificationReadinessService::EXCLUDED_PATHS,
      # or the courier release fingerprint will never match the server
      # (enforced by DeployWorkflowInternalFilesExclusionTest). rsync's
      # --delete never removes excluded paths, so the post-deploy step deletes
      # any copies that earlier deploys left behind.
      - name: Sync files to server
        env:
          RSYNC_RSH: ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}
        run: |
          rsync -azP \
            --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='storage/app/public/*' \
            --exclude='storage/app/private/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='storage/framework/down' \
            --exclude='storage/framework/maintenance.php' \
            --exclude='/docs' \
            --exclude='/tests' \
            --exclude='/.claude' \
            --exclude='/.agents' \
            --exclude='/.codex' \
            --exclude='/.gemini' \
            --exclude='/CLAUDE.md' \
            --exclude='/AGENTS.md' \
            --exclude='/GEMINI.md' \
            --exclude='/.mcp.json' \
            --exclude='/boost.json' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # ── 7. Post-deploy artisan commands ──────────────────────────────────────
      - name: Run post-deploy tasks on server
        run: |
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e
            cd '${{ secrets.DEPLOY_PATH }}'

            if [ ! -f .env ]; then
              echo '❌ ERROR: .env file is missing.'
              exit 1
            fi

            # DEPLOY-SAFETY-001 (Tier 1): existence alone doesn't catch a
            # stale/incomplete .env — check each required key has a non-empty
            # value without ever printing it (grep -q only reports match/no
            # match, never the matched line).
            for key in APP_KEY DB_CONNECTION DB_DATABASE DB_USERNAME DB_PASSWORD; do
              if ! grep -Eq \"^\$key=.+\" .env; then
                echo \"❌ ERROR: \$key is missing or empty in .env.\"
                exit 1
              fi
            done

            # INFRA-005: the app still runs without these, just quietly worse
            # (a missing mailer drops verification codes into a log). This
            # step runs after files are synced, so it warns instead of
            # stopping a deploy halfway. Values are never printed.
            # SEC-020: SMS_FORWARDER_TOKEN removed from this list — it moved
            # to the Setting table and nothing reads it from .env anymore.
            for key in MAIL_MAILER MAIL_HOST MAIL_USERNAME MAIL_PASSWORD; do
              if ! grep -Eq \"^\$key=.+\" .env; then
                echo \"::warning::\$key is missing or empty in .env.\"
              fi
            done

            if grep -Eq '^MAIL_MAILER=.?log.?$' .env; then
              echo '::warning::MAIL_MAILER is log, so customer emails are not being sent.'
            fi

            # SEC-022: remove internal files that deploys before this fix shipped.
            rm -rf docs tests .claude .agents .codex .gemini CLAUDE.md AGENTS.md GEMINI.md .mcp.json boost.json

            mkdir -p bootstrap/cache storage/framework/{sessions,views,cache/data} storage/logs
            # DEPLOY-SAFETY-001 (Tier 1): no longer swallowed with `|| true` —
            # set -e above now stops the deploy if this genuinely fails,
            # rather than silently continuing with wrong permissions.
            chmod -R 775 bootstrap/cache storage
            rm -rf public/storage
            ln -snf ../storage/app/public public/storage

            # bootstrap/cache/*.php is excluded from the rsync above (so a
            # mid-sync tree is never served from a half-updated cache), which
            # means a stale cache here survives every deploy indefinitely —
            # discovered when packages.php/services.php (regenerated only by
            # composer, which never runs on this server) sat 5+ months stale
            # and left spatie/laravel-activitylog unregistered, which crashed
            # every single artisan command (including config:clear itself,
            # since booting to run it already triggers the same crash) with
            # 'Trying to access array offset on null' in CauserResolver.php.
            # Deleting the cache files directly, before any artisan command
            # runs, sidesteps that chicken-and-egg failure entirely.
            rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/events.php bootstrap/cache/packages.php bootstrap/cache/services.php
            php artisan package:discover --ansi

            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan event:clear
            php artisan migrate --force
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # INFRA-001: everything is in place, so end maintenance mode.
            php artisan up"

      # INFRA-001: never leave the site on the maintenance page because a
      # step after it failed. If the new code can't even boot artisan, the
      # maintenance files are removed directly. This brings the (possibly
      # broken) site back up; the run still fails so a human looks at it.
      - name: Bring the site back up after a failed deploy
        if: failure() && steps.maintenance.outcome == 'success'
        run: |
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd '${{ secrets.DEPLOY_PATH }}' && (php artisan up || rm -f storage/framework/down storage/framework/maintenance.php)"

      # MED-15: the new code is already live here, so this can only fail the
      # run and alert a human. It can't roll anything back.
      - name: Verify production runtime after deploying
        shell: bash
        run: |
          printf '%s' "$VERIFY_RUNTIME_SCRIPT" | ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -s -- '${{ secrets.DEPLOY_PATH }}' active-config"

      # ── 8. Post-deploy health check ──────────────────────────────────────────
      # DEPLOY-SAFETY-001 (Tier 1): confirms the app actually boots after the
      # deploy, rather than only trusting that the SSH script exited 0. Note:
      # Laravel's /up has no DiagnosingHealth listener registered in this app,
      # so this proves the PHP/Laravel boot succeeds, not that the database is
      # reachable or correct — a known, accepted limitation of Tier 1.
      - name: Verify deployment health
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 https://shoppydrive.com/up > /dev/null; then
              echo "✅ Health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 10 attempts — deployment is live but the application is not responding healthily."
          exit 1