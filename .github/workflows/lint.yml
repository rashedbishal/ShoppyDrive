name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip, bcmath, opcache
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      # app.tsx imports resources/js/ziggy.js, which is gitignored
      # (generated build output, like Wayfinder's resources/js/actions) —
      # it has to exist for ESLint/tsc to resolve the import at all.
      - name: Generate Ziggy routes file
        run: php artisan ziggy:generate

      # resources/js/actions and resources/js/routes are gitignored too, and
      # normally only appear when `npm run build` runs the Wayfinder Vite
      # plugin. Without them ESLint can't resolve `@/actions`/`@/routes`
      # imports, so import/order sorts them differently than everywhere else
      # and tsc can't type-check them. Same flags as the Vite plugin.
      - name: Generate Wayfinder routes and actions
        run: php artisan wayfinder:generate --with-form

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run types:check
